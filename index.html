<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroPrever - Painel do Produtor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="navbar">
        <h1>🌱 AgroPrever</h1>
        <p>Agrinho 2026 - Categoria Front-End</p>
    </header>

    <main class="dashboard-container">
        
        <section class="card">
            <h2>🌦️ Previsão do Tempo</h2>
            <div class="clima-info">
                <h3>Paraná, BR</h3>
                <p class="temperatura">26°C</p>
                <p>Sol com poucas nuvens</p>
            </div>
            <button class="btn-atualizar" id="btnClima">Atualizar Dados</button>
        </section>

        <section class="card grafico">
            <h2>💧 Umidade do Solo</h2>
            <canvas id="graficoUmidade"></canvas>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 - Desenvolvido para o Concurso Agrinho</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
