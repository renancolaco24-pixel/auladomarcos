<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Espaço Dev</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fundo moderno com degradê animado */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Card Principal */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 90%;
        }

        /* Foto de Perfil (Opcional) */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #fff;
            margin-bottom: 1.5rem;
            object-fit: cover;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        /* Efeito de Digitação */
        .typing-text {
            font-size: 1.2rem;
            border-right: 3px solid #fff;
            white-space: nowrap;
            margin: 0 auto 2rem auto;
            overflow: hidden;
            width: 0;
            animation: typing 3.5s steps(30, end) infinite, blink .75s step-end infinite;
        }

        @keyframes typing {
            0% { width: 0 }
            50% { width: 100% }
            85% { width: 100% }
            100% { width: 0 }
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #fff }
        }

        /* Botões de Links/Redes Sociais */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn:hover {
            background: #fff;
            color: #333;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://github.com/identicons/johndoe.png" alt="Foto de Perfil" class="profile-img">
        
        <h1>Olá, eu sou o [Seu Nome]!</h1>
        <div class="typing-text">Desenvolvedor & Criador de Conteúdo.</div>
        
        <div class="links-container">
            <a href="https://github.com/SEU_USUARIO" target="_blank" class="btn">Meu GitHub</a>
            <a href="https://linkedin.com/in/SEU_LINKEDIN" target="_blank" class="btn">LinkedIn</a>
            <a href="mailto:seu-email@email.com" class="btn">Contato via E-mail</a>
        </div>
    </div>

</body>
</html>
